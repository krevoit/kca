name: Docker (GHCR)

# Builds the headless KCA server + WebUI image and publishes it to
# ghcr.io/krevoit/kca. Tagged releases also push version tags; pushes to main
# refresh `edge`; manual runs can target any ref.
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push (for example kca-test). Optional."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push server image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="ghcr.io/krevoit/kca:edge"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags="$tags
          ghcr.io/krevoit/kca:${{ github.ref_name }}
          ghcr.io/krevoit/kca:latest"
          fi
          if [[ -n "${{ inputs.tag }}" ]]; then
            tags="$tags
          ghcr.io/krevoit/kca:${{ inputs.tag }}"
          fi
          {
            echo "value<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # KCA fork: linux/amd64 only. The image carries a native node-pty
          # binary, so arm64 needs a native (non-QEMU) builder to stay sane.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/krevoit/kca
            org.opencontainers.image.title=KCA
            org.opencontainers.image.description=KCA headless server with bundled WebUI
